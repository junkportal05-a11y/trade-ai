[alembic]
# Configuration for Alembic migrations
# Base directory for migrations
dir = migrations
# SQL file extension to generate migrations
sql = sql
# Database type
version = 1
# Automatic revision ID (UUID)
auto_revision_id = true
# Database backend (already set as PostgreSQL)
# Past migration location
existing = {}
# Configuration for our SQLite local mode
# Default SQLite filename
file = ./trading_platform.db
# Texture for float fields
float_precision = 12
# --- New Phase Omega configurations ---
# Trinity carving customization
trinity_carving = false
# Domain engineering
# SaaS adjustments
saas_domain = False
# Recon slides
recon_slides = 0
# Variable recon
variable_recon = False
# Email triggers
email_triggers = []