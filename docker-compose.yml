version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apextrade-backend
    ports:
      - "7860:7860"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - trading_data:/app/data
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 7860 --reload
    restart: unless-stopped
    networks:
      - apextrade

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apextrade-frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env.local
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    restart: unless-stopped
    networks:
      - apextrade
    depends_on:
      - backend

volumes:
  trading_data:

networks:
  apextrade:
    driver: bridge
