<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA & Theme -->
    <meta name="theme-color" content="#080a0f" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ApexTrade" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- SEO & Meta -->
    <meta name="description" content="Real-time NSE intraday trading signals, capital allocation engine, and AI-powered market analysis." />
    <meta name="application-name" content="ApexTrade" />
    <meta name="keywords" content="NSE, BSE, intraday trading, stock signals, candlestick patterns, India" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <title>ApexTrade — NSE Intraday Signals</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js', { scope: '/' })
            .then(reg => {
              console.log('[ApexTrade] Service worker registered:', reg.scope);

              // Check for updates every 60 seconds
              setInterval(() => reg.update(), 60_000);

              // Notify user when new version is ready
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // New version available — reload to apply
                    console.log('[ApexTrade] New version available, reloading...');
                    window.location.reload();
                  }
                });
              });
            })
            .catch(err => console.warn('[ApexTrade] SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
