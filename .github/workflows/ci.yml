name: CI Check Status

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          pip install -r backend/requirements.txt || pip install -r backend/requirements.txt --no-deps

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: "sqlite:///:memory:"
          JWT_SECRET: "test_jwt_secret_for_ci_build"
          ADMIN_KEY: "test_admin_key_ci"
          TESTING: "true"
          PYTHONPATH: "backend"
        run: |
          cd backend
          python -m pytest tests/test_validation_and_guards.py tests/test_backtest_engine.py tests/test_bot_auth.py tests/test_capital_manager.py tests/test_is_nse_market_open.py tests/test_nse_market.py tests/test_perf.py tests/test_session_cleanup.py tests/test_vwap_veto.py tests/test_main_import.py tests/test_admin.py tests/test_angelone_login.py tests/test_search.py -v --disable-warnings -o asyncio_mode=auto

  frontend-build:
    name: Frontend Build Check (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Verify Frontend Production Build
        env:
          VITE_API_URL: ""
          VITE_WS_URL: "wss://apextrade-core-trade-ai-backend.hf.space"
        run: |
          cd frontend
          npx vite build

  docker-sanity:
    name: Docker Sanity Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Test Docker Build
        run: |
          docker build -t apextrade-backend:ci ./backend
