name: CI Check Status

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'
      - 'requirements.txt'
      - 'pytest.ini'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'
      - 'requirements.txt'
      - 'pytest.ini'

jobs:
  backend-test:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        env:
          JWT_SECRET: "test_jwt_secret_for_ci_build"
          ADMIN_KEY: "test_admin_key_ci"
          TESTING: "true"
          PYTHONPATH: "backend"
          SKIP_BACKGROUND_WORKERS: "true"
        run: |
          cd backend
          python -m pytest tests/ -v --disable-warnings -o asyncio_mode=auto --ignore=tests/test_worker_startup.py

  frontend-build:
    name: Frontend Build Check (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: Verify Frontend Production Build
        env:
          VITE_API_URL: ""
          VITE_WS_URL: "wss://apextrade-core-trade-ai-backend.hf.space"
          CI: "true"
        run: |
          cd frontend
          echo "VITE_API_URL='$VITE_API_URL'"
          echo "VITE_WS_URL='$VITE_WS_URL'"
          npx vite build

  docker-sanity:
    name: Docker Sanity Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker Build (backend)
        run: |
          docker build --progress=plain -t apextrade-backend:ci ./backend

  docker-smoke:
    name: Root Dockerfile Build + Smoke Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Root Dockerfile Image
        run: |
          docker build --progress=plain -t apextrade-backend:smoke .

      - name: Run Container
        run: |
          docker run -d --name apextrade-smoke \
            -p 7860:7860 \
            -e PORT=7860 \
            -e JWT_SECRET="ci_smoke_jwt_secret" \
            -e ADMIN_KEY="ci_smoke_admin_key" \
            -e SKIP_BACKGROUND_WORKERS="true" \
            apextrade-backend:smoke

      - name: Wait for Container to Start
        run: |
          sleep 10

      - name: Smoke GET /api/health/ping
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null -w "HTTP %{http_code}\n" --max-time 5 "http://127.0.0.1:7860/api/health/ping"; then
              echo "Health check passed on attempt $i"
              exit 0
            fi
            echo "attempt $i/30 failed, retrying in 2s..."
            sleep 2
          done
          echo "::error::/api/health/ping never returned 200"
          docker logs apextrade-smoke
          exit 1

      - name: Container Logs On Failure
        if: failure()
        run: docker logs apextrade-smoke

      - name: Stop Container
        if: always()
        run: docker stop apextrade-smoke
